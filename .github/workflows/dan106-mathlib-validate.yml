name: DAN-106 Mathlib candidate validation

# Intentionally branch-scoped and one-shot: editing only this workflow triggers a run.
# No main/legacy publishing or root/engineering builds.
on:
  push:
    branches:
      - work/dan106-mathlib-lab-20261118
    paths:
      - .github/workflows/dan106-mathlib-validate.yml

permissions:
  contents: read

jobs:
  validate-mathlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mathlib
        shell: bash
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record exact revision and toolchain
        run: |
          mkdir -p evidence
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "runner=$RUNNER_OS"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "toolchain=$(cat lean-toolchain)"
            lake --version
            lean --version
          } 2>&1 | tee evidence/environment.log

      - name: Verify committed dependency manifest
        run: |
          set -o pipefail
          test -s lake-manifest.json
          git ls-files --error-unmatch lake-manifest.json
          sha256sum lake-manifest.json | tee evidence/manifest-sha256.txt
          printf 'manifest is present and tracked; do NOT update locked dependencies.\n' | tee evidence/lake-update.log

      - name: Obtain official Mathlib cached build
        run: |
          set -o pipefail
          lake exe cache get 2>&1 | tee evidence/cache-get.log

      - name: Typecheck all candidate exercises
        run: |
          set -o pipefail
          lake build MathlibLearningLab 2>&1 | tee evidence/lake-build.log

      - name: Observe isolated CH10 search tactics and explicit controls
        run: |
          : > evidence/ch10-exit-codes.tsv
          for f in experiments/Ch10ExactSearch.lean experiments/Ch10ApplySearch.lean experiments/Ch10ExplicitControls.lean; do
            label="$(basename "$f" .lean)"
            set +e
            lake env lean "$f" > "evidence/${label}.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$f" "$status" | tee -a evidence/ch10-exit-codes.tsv
            cat "evidence/${label}.log"
          done
          # Experiments are observations; the individual exit codes above
          # are evidence. Do not equate green CI with all three passing.

      - name: Preserve manifest and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dan106-mathlib-evidence
          path: |
            mathlib/lake-manifest.json
            mathlib/evidence/*
          if-no-files-found: warn
          retention-days: 7
