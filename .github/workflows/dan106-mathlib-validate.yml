name: DAN-106 Mathlib candidate validation

# Intentionally branch-scoped and one-shot: editing only this workflow triggers a run.
# No main/legacy publishing or root/engineering builds.
on:
  push:
    branches:
      - work/dan106-mathlib-lab-20261118
    paths:
      - .github/workflows/dan106-mathlib-validate.yml

permissions:
  contents: read

jobs:
  validate-mathlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mathlib
        shell: bash
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record exact revision and toolchain
        run: |
          mkdir -p evidence
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "runner=$RUNNER_OS"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "toolchain=$(cat lean-toolchain)"
            lake --version
            lean --version
          } 2>&1 | tee evidence/environment.log

      - name: Resolve dependencies and generate manifest
        run: |
          set -o pipefail
          lake update 2>&1 | tee evidence/lake-update.log

      - name: Obtain official Mathlib cached build
        run: |
          set -o pipefail
          lake exe cache get 2>&1 | tee evidence/cache-get.log

      - name: Typecheck all candidate exercises
        run: |
          set -o pipefail
          lake build MathlibLearningLab 2>&1 | tee evidence/lake-build.log

      - name: Preserve manifest and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dan106-mathlib-evidence
          path: |
            mathlib/lake-manifest.json
            mathlib/evidence/*.log
          if-no-files-found: warn
          retention-days: 7
